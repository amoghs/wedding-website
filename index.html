<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amogh and Helene get married!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <link rel="preload" as="image" href="/photos/hero.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">

    <style>
        :root {
            --sage-green: #8B9D83;
            --terracotta: #C97557;
            --cream: #FAF7F2;
            --ivory: #FFFFF0;
            --blush: #E8C5B5;
            --charcoal: #2C3E3F;
            --text-dark: #2C3E3F;
            --text-light: #6B7F7E;
            --gold: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Palm Tree Animation */
        .palm-tree {
            position: fixed;
            top: 20px;
            right: 40px;
            font-size: 2rem;
            z-index: 1000;
            animation: palmSway 3s ease-in-out infinite;
            transform-origin: bottom center;
            opacity: 0.6;
        }

        @keyframes palmSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* RSVP Link */
        .rsvp-link {
            position: fixed;
            top: 40px;
            right: 80px;
            z-index: 1000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--sage-green);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .rsvp-link:hover {
            opacity: 1;
            color: var(--text-dark);
            transform: translateY(-1px);
        }

        /* Floral Background Elements */
        .floral-bg {
            position: absolute;
            opacity: 0.08;
            pointer-events: none;
        }

        .floral-top-left {
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: url('/photos/flowers.png') no-repeat;
            background-size: contain;
            opacity: 1;
        }

        .floral-bottom-right {
            bottom: -50px;
            right: -50px;
            width: 350px;
            height: 350px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path d="M100,50 Q120,30 140,50 Q160,70 140,90 Q120,110 100,90 Q80,70 60,50 Q40,30 60,10 Q80,-10 100,10 Q120,-10 140,10 Q160,30 140,50" fill="%23C97557" opacity="0.3"/><circle cx="100" cy="50" r="15" fill="%23C97557" opacity="0.4"/></svg>') no-repeat;
            background-size: contain;
            transform: rotate(25deg);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6rem 2rem 0 2rem;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -5%;
            width: 60%;
            height: 70%;
            background: radial-gradient(circle, rgba(139, 157, 131, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(1.1); }
        }

        .hero-photo-container {
            width: 550px;
            max-width: 100%;
            aspect-ratio: 55 / 30;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            box-shadow: 0 15px 40px rgba(139, 157, 131, 0.25);
            opacity: 0;
            animation: fadeInScale 0.4s ease-out 0.1s forwards;
            position: relative;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 5%;
        }

        .hero-photo-placeholder {
            width: 100%;
            height: 100%;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: left;
            max-width: 800px;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 0.2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-greeting {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            font-weight: 400;
        }

        .hero-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-weight: 400;
        }

        .hero-ampersand {
            font-style: italic;
            color: var(--sage-green);
            margin: 0 0.5rem;
            font-weight: 300;
        }

        .hero-tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: var(--text-light);
            font-weight: 400;
            line-height: 1.5;
        }

        .hero-emoji {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            font-weight: 400;
        }

        .hero-divider {
            display: none;
        }

        /* Events Section */
        .events {
            padding: 1rem 2rem 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .section-divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--sage-green), transparent);
            margin: 0 auto 2rem auto;
            opacity: 0;
        }

        .section-divider.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            text-align: center;
            margin-bottom: 1rem;
            color: var(--text-dark);
            opacity: 0;
            font-weight: 400;
        }

        .section-title.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            opacity: 0;
        }

        .section-subtitle.visible {
            animation: fadeInUp 0.4s ease-out 0.1s forwards;
        }

        .events-grid {
            display: grid;
            gap: 1.25rem;
            margin-top: 1.5rem;
        }

        .event-card {
            border-radius: 14px;
            padding: 2rem 2rem 1.75rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            border: none;
        }

        .event-card.visible {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        .event-card:hover {
            transform: translateY(-4px);
        }

        /* Decorative watermark emoji */
        .event-card::after {
            content: attr(data-watermark);
            position: absolute;
            bottom: -10px;
            right: -5px;
            font-size: 7rem;
            opacity: 0.08;
            pointer-events: none;
            line-height: 1;
        }

        /* Haldi:sunny turmeric */
        .event-card.haldi {
            --event-color: #B8860B;
            --event-color-light: #D4A017;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            box-shadow: 0 6px 24px rgba(253, 230, 138, 0.5), 0 2px 8px rgba(0,0,0,0.06);
        }
        .event-card.haldi:hover {
            box-shadow: 0 12px 36px rgba(253, 230, 138, 0.6), 0 4px 12px rgba(0,0,0,0.08);
        }

        /* Western:rosy blush */
        .event-card.western {
            --event-color: #B85C42;
            --event-color-light: #C97557;
            background: linear-gradient(135deg, #FDE8E4 0%, #F5CFC6 100%);
            box-shadow: 0 6px 24px rgba(245, 207, 198, 0.5), 0 2px 8px rgba(0,0,0,0.06);
        }
        .event-card.western:hover {
            box-shadow: 0 12px 36px rgba(245, 207, 198, 0.6), 0 4px 12px rgba(0,0,0,0.08);
        }

        /* Indian:warm saffron */
        .event-card.indian {
            --event-color: #B8860B;
            --event-color-light: #D4AF37;
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
            box-shadow: 0 6px 24px rgba(255, 224, 178, 0.5), 0 2px 8px rgba(0,0,0,0.06);
        }
        .event-card.indian:hover {
            box-shadow: 0 12px 36px rgba(255, 224, 178, 0.6), 0 4px 12px rgba(0,0,0,0.08);
        }

        .event-card.haldi:nth-child(1) { animation-delay: 0.05s; }
        .event-card.western:nth-child(2) { animation-delay: 0.1s; }
        .event-card.indian:nth-child(3) { animation-delay: 0.15s; }

        .event-number {
            display: none;
        }

        .event-header {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .event-emoji {
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .event-info-block {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            display: grid;
            gap: 0.6rem;
        }

        .event-info-row {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .event-info-row .info-icon {
            font-size: 0.9rem;
            flex-shrink: 0;
            width: 1.25rem;
            text-align: center;
        }

        .event-info-row .info-label {
            font-weight: 500;
            min-width: 5.5rem;
            flex-shrink: 0;
            color: var(--event-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .event-info-row .info-value {
            flex: 1;
            color: #1a1a1a;
        }

        .event-info-row a {
            color: var(--event-color);
            text-decoration: none;
            font-weight: 400;
        }

        .event-info-row a:hover {
            opacity: 0.7;
        }

        .event-info-divider {
            height: 1px;
            background: rgba(0, 0, 0, 0.06);
            margin: 0;
        }

        .event-note-inline {
            padding: 0.6rem 0.85rem;
            background: rgba(255, 255, 255, 0.5);
            border-left: 3px solid var(--event-color-light, var(--sage-green));
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-light);
            line-height: 1.5;
            margin-top: 0.6rem;
        }

        /* Card flip animation */
        .event-card-wrapper .event-card {
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform-origin: center center;
        }

        .event-card-wrapper.flipping .event-card {
            transform: perspective(800px) rotateY(90deg) scale(0.95) !important;
            opacity: 0 !important;
        }

        .card-back {
            display: none;
        }

        .event-card-wrapper.flipped .card-front {
            display: none;
        }

        .event-card-wrapper.flipped .card-back {
            display: block;
        }

        /* Schedule table in When row */
        .schedule-table {
            margin-top: 0.35rem;
            border-collapse: collapse;
        }

        .schedule-table td {
            padding: 0.15rem 0;
            font-size: 0.8rem;
            color: #1a1a1a;
            vertical-align: top;
        }

        .schedule-table .sched-time {
            color: #1a1a1a;
            font-weight: 600;
            padding-right: 0.75rem;
            white-space: nowrap;
        }

        .schedule-note {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-style: italic;
            color: var(--text-light);
        }

        /* Flip link in Where row */
        .flip-link {
            display: inline-block;
            margin-top: 0.35rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--event-color);
            transition: opacity 0.2s;
        }

        .flip-link:hover {
            opacity: 0.7;
        }

        /* Back button on flip side */
        .flip-back-button {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.75rem;
            margin-bottom: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--event-color);
            transition: all 0.2s;
        }

        .flip-back-button:hover {
            background: rgba(255, 255, 255, 0.75);
        }

        .card-back-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }

        .arrival-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 500px) {
            .arrival-grid {
                grid-template-columns: 1fr;
            }
        }

        .arrival-col {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
        }

        .arrival-col-heading {
            font-weight: 500;
            color: var(--text-dark);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .arrival-col ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .arrival-col ul li {
            padding: 0.1rem 0;
            color: var(--text-light);
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .arrival-notes {
            font-size: 0.85rem;
            color: #333;
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }

        .arrival-notes p {
            margin-bottom: 0.4rem;
        }

        .arrival-notes p:last-child {
            margin-bottom: 0;
        }

        .arrival-map {
            border-radius: 6px;
            overflow: hidden;
        }

        .arrival-map img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        .event-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--text-dark);
            font-weight: 500;
            line-height: 1.2;
        }

        .event-time {
            color: var(--text-light);
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
        }

        .event-location {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .event-location-icon {
            color: var(--event-color);
            margin-top: 0.2rem;
            flex-shrink: 0;
        }

        .event-location-text {
            color: var(--text-dark);
        }

        .event-link {
            display: inline-block;
            margin-top: 0.25rem;
            color: var(--event-color);
            text-decoration: none;
            font-size: 0.8rem;
            transition: opacity 0.2s ease;
        }

        .event-link:hover {
            opacity: 0.7;
        }

        .event-note {
            margin-top: 0.6rem;
            padding: 0.5rem 0.75rem;
            background: var(--cream);
            border-left: 3px solid var(--sage-green);
            font-size: 0.8rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* Today highlight */
        .event-today {
            box-shadow: 0 0 0 2px var(--gold), 0 8px 32px rgba(212, 175, 55, 0.2);
            transform: scale(1.02);
        }
        .event-today-badge {
            display: inline-block;
            background: linear-gradient(110deg, var(--gold) 0%, var(--gold) 40%, #f0dc82 50%, var(--gold) 60%, var(--gold) 100%);
            background-size: 200% 100%;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 0.5rem;
            vertical-align: middle;
            animation: todayShimmer 2.5s ease-in-out infinite;
        }
        @keyframes todayShimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Seating link */
        .seating-link {
            cursor: pointer;
            color: var(--event-color);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .seating-link:hover { opacity: 0.7; }

        /* Seating modal */
        .seating-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .seating-modal-content {
            background: var(--cream);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .seating-modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.2s;
        }
        .seating-modal-close:hover { color: var(--text-dark); }
        .seating-modal-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 1.25rem;
        }
        .seating-table {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            background: rgba(255,255,255,0.6);
        }
        .seating-table-highlight {
            background: rgba(201, 117, 87, 0.12);
            border: 1px solid rgba(201, 117, 87, 0.3);
        }
        .seating-table-num {
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }
        .seating-table-guests {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.5;
        }
        .seating-guest-you {
            font-weight: 500;
            color: var(--terracotta);
        }

        /* RSVP Section */
        .rsvp {
            padding: 6rem 2rem;
            background: linear-gradient(to bottom, var(--cream), var(--ivory));
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .rsvp::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--sage-green), transparent);
        }

        .rsvp-content {
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
        }

        .rsvp-content.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .rsvp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            margin-bottom: 1.5rem;
            color: var(--text-dark);
            font-weight: 400;
        }

        .rsvp-message {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .rsvp-deadline {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            border: 1px solid var(--sage-green);
            border-radius: 4px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(139, 157, 131, 0.1);
        }

        .rsvp-deadline-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .rsvp-deadline-date {
            font-weight: 600;
            color: var(--sage-green);
        }

        .whatsapp-button {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 2.5rem;
            background: var(--sage-green);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 157, 131, 0.3);
        }

        .whatsapp-button:hover {
            background: var(--terracotta);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 117, 87, 0.4);
        }

        .whatsapp-icon {
            width: 24px;
            height: 24px;
        }

        /* Photo Gallery */
        .gallery {
            padding: 6rem 2rem 8rem;
            background: var(--cream);
        }

        .gallery-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            text-align: center;
            margin-bottom: 4rem;
            color: var(--text-dark);
            opacity: 0;
            font-weight: 400;
        }

        .gallery-title.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/5;
            background: white;
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-item.wide {
            grid-column: 1 / -1;
            aspect-ratio: 21/9;
            max-width: 1000px;
            justify-self: center;
        }

        .gallery-item.visible {
            animation: photoReveal 0.4s ease-out forwards;
        }

        @keyframes photoReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .gallery-item:nth-child(1) { animation-delay: 0.05s; }
        .gallery-item:nth-child(2) { animation-delay: 0.1s; }
        .gallery-item:nth-child(3) { animation-delay: 0.15s; }
        .gallery-item:nth-child(4) { animation-delay: 0.2s; }
        .gallery-item:nth-child(5) { animation-delay: 0.25s; }
        .gallery-item:nth-child(6) { animation-delay: 0.3s; }
        .gallery-item:nth-child(7) { animation-delay: 0.35s; }
        .gallery-item:nth-child(8) { animation-delay: 0.4s; }
        .gallery-item:nth-child(9) { animation-delay: 0.45s; }
        .gallery-item:nth-child(10) { animation-delay: 0.5s; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            text-align: center;
            padding: 2rem;
        }

        /* Footer */
        .footer {
            padding: 3rem 2rem;
            background: var(--charcoal);
            color: var(--cream);
            text-align: center;
        }

        .footer-hearts {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.6;
            color: var(--sage-green);
            line-height: 1;
        }

        .footer-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .palm-tree {
                top: 15px;
                right: 20px;
                font-size: 2rem;
            }

            .rsvp-link {
                top: 30px;
                right: 70px;
                font-size: 0.75rem;
            }

            .hero {
                min-height: 70vh;
                padding: 1.5rem 1.5rem 0 1.5rem;
            }

            .hero-photo-container {
                width: 320px;
                height: 220px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-names {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .events {
                padding: 1rem 1.5rem 4rem 1.5rem;
            }

            .event-card {
                padding: 1.5rem 1.25rem;
            }

            .event-info-row {
                flex-wrap: wrap;
                font-size: 0.82rem;
            }

            .event-info-row .info-label {
                min-width: 4rem;
                font-size: 0.72rem;
            }

            .schedule-table td {
                font-size: 0.72rem;
            }

            .event-header {
                flex-wrap: wrap;
            }

            .event-today-badge {
                margin-left: 0;
                margin-top: 0.3rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1.5rem;
            }

            .rsvp {
                padding: 2rem 4rem;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>

    <script>
        // Flip card animation
        function flipCard(wrapper) {
            if (wrapper.dataset.flipping) return;
            wrapper.dataset.flipping = '1';
            wrapper.classList.add('flipping');
            setTimeout(() => {
                wrapper.classList.toggle('flipped');
                wrapper.classList.remove('flipping');
                setTimeout(() => { delete wrapper.dataset.flipping; }, 350);
            }, 300);
        }

        // Parse URL path to extract invitation type and guest name
        const pathname = window.location.pathname;
        const pathParts = pathname.split('/').filter(part => part.length > 0);

        // First part is invitation type, second part (if exists) is guest name
        const inviteType = pathParts[0] || '';
        const guestName = pathParts[1] ? decodeURIComponent(pathParts[1]) : '';

        // Event data
        const events = {
            haldi: {
                number: '01',
                emoji: '🌼',
                date: 'Saturday, April 18, 2026',
                isoDate: '2026-04-18',
                title: 'Haldi & Mehndi',
                time: '11:00 AM - 4:00 PM',
                location: 'Quakers Hill Community Centre',
                link: 'https://share.google/sGi9lWsCJyVD0UH06',
                dressCode: 'Bright colors! Think yellows, oranges, pinks. Traditional Indian attire encouraged but no biggie either way!',
                class: 'haldi'
            },
            western: {
                number: '02',
                emoji: '🤵',
                date: 'Sunday, April 19, 2026',
                isoDate: '2026-04-19',
                title: 'Western ceremony',
                time: '10:00 AM - 3:00 PM',
                location: 'Sergeants Mess',
                link: 'https://share.google/fhZjVlDqaahowCCKu',
                note: 'We will have an after party at our place 🕺',
                dressCode: 'Semi-formal to formal. Suits, dresses, or cocktail attire.',
                schedule: [
                    { time: '9:30 AM', label: 'Shuttle service starts' },
                    { time: '9:45 AM', label: 'Bridal party arrives' },
                    { time: '10:00 AM', label: 'Ceremony' },
                    { time: '10:15 AM', label: 'Shuttle service ends' },
                    { time: '2:45 PM', label: 'Farewells' },
                    { time: '3:00 PM', label: 'Close' }
                ],
                parking: {
                    summary: 'Park nearby + free shuttle to venue.',
                    notes: [
                        'A traffic steward will direct cars to Car Park 4, located on Middle Head Road, 200m past Chowder Bay Road on the right.',
                        'A shuttle will take guests from Car Park 4 to the venue in small groups, starting 30 mins before the ceremony.',
                        'Shuttles will also run at the end to take guests back to the car park.',
                        'Taxis can proceed directly to the venue. Guests will need to arrange their own taxis for departure.'
                    ],
                    mapImage: '/photos/sergeants-mess-map.jpg'
                },
                seating: {
                    1: ['Sonu', 'Govind', 'Hugues', 'Marta', 'Thomas', 'Vishesh', 'Ana Lucia'],
                    2: ['Anshu', 'Shubra', 'Nani', 'Sangeeta', 'Ratna', 'Renu'],
                    3: ['Andrew', 'Oanh', 'Alex', 'Daniul', 'Dorfa', 'Moaz'],
                    4: ['Anish', 'Michael', 'Amaresh', 'Dave', 'Hannah', 'Norma'],
                    5: ['Shelley', 'Tony', 'Richard', 'Debanjan', 'Charles', 'Andy', 'Tasman'],
                    6: ['Peter', 'Michelle', 'Elvis', 'Ollie', 'Fiona'],
                    7: ['Graham', 'Erol', 'Medhavi', 'Lucy', 'Kylie', 'Callum'],
                    8: ['Doriane', 'Elise Paillard', 'Theo', 'Panos', 'Dava', 'Baby Leandros', 'Carlos', 'Sam'],
                    9: ['Jascha', 'Sooyeon', 'Omar', 'Destiny', 'Nico', 'Jenny'],
                    10: ['Ben', 'Stef', 'Baby Caleb', 'Elise Stephenson', 'Mikhara', 'Aisha'],
                    11: ['Pat', 'Kelly', 'Peter G', 'Brandon', 'Jin', 'James']
                },
                class: 'western'
            },
            indian: {
                number: '03',
                emoji: '🇮🇳',
                date: 'Monday, April 20, 2026',
                isoDate: '2026-04-20',
                title: 'Indian ceremony',
                time: '4:00 PM - 10:00 PM',
                location: 'The Madison Function Centre',
                link: 'https://share.google/T5ytdSotduhiXzLSB',                
                dressCode: 'Indian formal attire encouraged like Sarees, lehengas, kurtas, or sherwanis. But no pressure at all, formal western also works!',
                class: 'indian'
            }
        };

        // Determine which events to show
        let eventsToShow = [];
        if (inviteType === 'vip') {
            eventsToShow = [events.haldi, events.western, events.indian];
        } else if (inviteType === 'friends') {
            eventsToShow = [events.western, events.indian];
        } else if (inviteType === 'sunday') {
            eventsToShow = [events.western];
        } else if (inviteType === 'wedding') {
            eventsToShow = [events.indian];
        }

        // If no invitation type, show message instead of events
        if (!inviteType) {
            document.getElementById('eventsTitle').textContent = 'Please access the specific link we shared for event details';
            document.getElementById('eventsGrid').style.display = 'none';
        } else {
            // Personalize greeting
            if (guestName) {
                document.getElementById('greeting').textContent = `👋 ${guestName},`;
            }

            // Update title based on number of events
            if (eventsToShow.length === 1) {
                document.getElementById('eventsTitle').textContent = 'Join our celebration';
            } else {
                document.getElementById('eventsTitle').textContent = 'Join our celebrations';
            }

            // Render events
            const eventsGrid = document.getElementById('eventsGrid');
            eventsToShow.forEach(event => {
                const hasParking = !!event.parking;
                const urlParams = new URLSearchParams(window.location.search);
                const today = urlParams.get('date') || new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
                const isToday = event.isoDate === today;

                // Seating lookup
                let seatingHTML = '';
                if (event.seating) {
                    let guestTable = null;
                    const nameLC = guestName.toLowerCase();
                    for (const [table, guests] of Object.entries(event.seating)) {
                        if (guests.some(g => g.toLowerCase() === nameLC || nameLC.includes(g.toLowerCase()) || g.toLowerCase().includes(nameLC))) {
                            guestTable = table;
                            break;
                        }
                    }
                    if (guestTable) {
                        seatingHTML = `
                            <div class="event-info-divider"></div>
                            <div class="event-info-row">
                                <span class="info-icon">🪑</span>
                                <span class="info-label">Table</span>
                                <span class="info-value">Table ${guestTable} · <a class="seating-link" onclick="document.getElementById('seatingModal').style.display='flex'">View all tables →</a></span>
                            </div>`;
                    } else {
                        seatingHTML = `
                            <div class="event-info-divider"></div>
                            <div class="event-info-row">
                                <span class="info-icon">🪑</span>
                                <span class="info-label">Seating</span>
                                <span class="info-value"><a class="seating-link" onclick="document.getElementById('seatingModal').style.display='flex'">View seating chart →</a></span>
                            </div>`;
                    }
                }

                // When row: include schedule if present
                const scheduleHTML = event.schedule
                    ? `<table class="schedule-table">${event.schedule.map(s => `<tr><td class="sched-time">${s.time}</td><td class="sched-label">${s.label}</td></tr>`).join('')}</table>`
                    : '';
                const noteHTML = event.note ? `<div class="schedule-note">${event.note}</div>` : '';
                const whenValue = event.schedule
                    ? `${event.date}${scheduleHTML}${noteHTML}`
                    : `${event.date}, ${event.time}`;

                // Where row: add parking callout if present
                const whereValue = hasParking
                    ? `${event.location} · <a href="${event.link}" target="_blank">Map →</a><br><a class="flip-link" onclick="flipCard(this.closest('.event-card-wrapper'))">${event.parking.summary} More info →</a>`
                    : `${event.location} · <a href="${event.link}" target="_blank">Map →</a>`;

                const headerHTML = `
                    <div class="event-header">
                        <span class="event-emoji">${event.emoji}</span>
                        <h3 class="event-title">${event.title}</h3>
                        ${isToday ? '<span class="event-today-badge">TODAY</span>' : ''}
                    </div>
                `;

                const infoBlockHTML = `
                    <div class="event-info-block">
                        <div class="event-info-row">
                            <span class="info-icon">🕐</span>
                            <span class="info-label">When</span>
                            <span class="info-value">${whenValue}</span>
                        </div>
                        <div class="event-info-divider"></div>
                        <div class="event-info-row">
                            <span class="info-icon">📍</span>
                            <span class="info-label">Where</span>
                            <span class="info-value">${whereValue}</span>
                        </div>
                        <div class="event-info-divider"></div>
                        <div class="event-info-row">
                            <span class="info-icon">👗</span>
                            <span class="info-label">Wear</span>
                            <span class="info-value">${event.dressCode}</span>
                        </div>
                        ${seatingHTML}
                    </div>
                `;

                if (hasParking) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'event-card-wrapper';

                    const card = document.createElement('div');
                    card.className = `event-card ${event.class}${isToday ? ' event-today' : ''}`;
                    card.setAttribute('data-watermark', event.emoji);

                    card.innerHTML = `
                        <div class="card-front">
                            ${headerHTML}
                            ${infoBlockHTML}
                        </div>
                        <div class="card-back">
                            <button class="flip-back-button" onclick="flipCard(this.closest('.event-card-wrapper'))">
                                ← Back
                            </button>
                            <div class="card-back-title">🚗 Parking & Shuttles</div>
                            <div class="arrival-notes">
                                ${event.parking.notes.map(n => `<p>${n}</p>`).join('')}
                            </div>
                            <div class="arrival-map">
                                <img src="${event.parking.mapImage}" alt="Venue map showing parking and shuttle route" loading="lazy">
                            </div>
                        </div>
                    `;

                    // Clear entrance animation after it finishes so flip transitions work
                    card.addEventListener('animationend', () => {
                        card.style.animation = 'none';
                        card.style.opacity = '1';
                        card.style.transform = 'none';
                    }, { once: true });

                    wrapper.appendChild(card);
                    eventsGrid.appendChild(wrapper);
                } else {
                    const card = document.createElement('div');
                    card.className = `event-card ${event.class}${isToday ? ' event-today' : ''}`;
                    card.setAttribute('data-watermark', event.emoji);
                    card.innerHTML = `${headerHTML}${infoBlockHTML}`;
                    eventsGrid.appendChild(card);
                }
                // Build seating modal if this event has seating
                if (event.seating) {
                    let modalHTML = `<div id="seatingModal" class="seating-modal" onclick="if(event.target===this)this.style.display='none'">
                        <div class="seating-modal-content">
                            <button class="seating-modal-close" onclick="document.getElementById('seatingModal').style.display='none'">✕</button>
                            <h3 class="seating-modal-title">Seating Chart</h3>
                            <div class="seating-tables">`;
                    for (const [table, guests] of Object.entries(event.seating)) {
                        const isGuestTable = guestName && guests.some(g => g.toLowerCase() === guestName.toLowerCase() || guestName.toLowerCase().includes(g.toLowerCase()) || g.toLowerCase().includes(guestName.toLowerCase()));
                        modalHTML += `<div class="seating-table ${isGuestTable ? 'seating-table-highlight' : ''}">
                            <div class="seating-table-num">Table ${table}</div>
                            <div class="seating-table-guests">${guests.map(g => {
                                const isYou = guestName && (g.toLowerCase() === guestName.toLowerCase() || guestName.toLowerCase().includes(g.toLowerCase()) || g.toLowerCase().includes(guestName.toLowerCase()));
                                return `<span class="${isYou ? 'seating-guest-you' : ''}">${g}${isYou ? ' (you!)' : ''}</span>`;
                            }).join(', ')}</div>
                        </div>`;
                    }
                    modalHTML += `</div></div></div>`;
                    document.body.insertAdjacentHTML('beforeend', modalHTML);
                }
            });
        }

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe elements
        document.querySelectorAll('.section-title, .section-subtitle, .event-card, .rsvp-content, .gallery-title, .gallery-item').forEach(el => {
            observer.observe(el);
        });

        // Hero photo and gallery photos are already loaded in HTML
    </script>

<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amogh &amp; Helene - Wedding Celebration</title>
    <link rel="preload" as="image" href="/photos/hero.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">

    <style>
        :root {
            --sage-green: #8B9D83;
            --terracotta: #C97557;
            --cream: #FAF7F2;
            --ivory: #FFFFF0;
            --blush: #E8C5B5;
            --charcoal: #2C3E3F;
            --text-dark: #2C3E3F;
            --text-light: #6B7F7E;
            --gold: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: white;
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Palm Tree Animation */
        .palm-tree {
            position: fixed;
            top: 20px;
            right: 40px;
            font-size: 2rem;
            z-index: 1000;
            animation: palmSway 3s ease-in-out infinite;
            transform-origin: bottom center;
            opacity: 0.6;
        }

        @keyframes palmSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        /* RSVP Link */
        .rsvp-link {
            position: fixed;
            top: 23px;
            right: 100px;
            z-index: 1000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--sage-green);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .rsvp-link:hover {
            opacity: 1;
            color: var(--text-dark);
            transform: translateY(-1px);
        }

        /* Floral Background Elements */
        .floral-bg {
            position: absolute;
            opacity: 0.08;
            pointer-events: none;
        }

        .floral-top-left {
            top: 0;
            left: 0;
            width: 400px;
            height: 400px;
            background: url('/photos/flowers.png') no-repeat;
            background-size: contain;
            opacity: 1;
        }

        .floral-bottom-right {
            bottom: -50px;
            right: -50px;
            width: 350px;
            height: 350px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><path d="M100,50 Q120,30 140,50 Q160,70 140,90 Q120,110 100,90 Q80,70 60,50 Q40,30 60,10 Q80,-10 100,10 Q120,-10 140,10 Q160,30 140,50" fill="%23C97557" opacity="0.3"/><circle cx="100" cy="50" r="15" fill="%23C97557" opacity="0.4"/></svg>') no-repeat;
            background-size: contain;
            transform: rotate(25deg);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6rem 2rem 0 2rem;
            position: relative;
            overflow: hidden;
            background: white;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -5%;
            width: 60%;
            height: 70%;
            background: radial-gradient(circle, rgba(139, 157, 131, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(1.1); }
        }

        .hero-photo-container {
            width: 550px;
            max-width: 100%;
            aspect-ratio: 55 / 30;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            box-shadow: 0 15px 40px rgba(139, 157, 131, 0.25);
            opacity: 0;
            animation: fadeInScale 0.4s ease-out 0.1s forwards;
            position: relative;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 5%;
        }

        .hero-photo-placeholder {
            width: 100%;
            height: 100%;
            background: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: left;
            max-width: 800px;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out 0.2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-greeting {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            font-weight: 400;
        }

        .hero-names {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            line-height: 1.2;
            font-weight: 300;
        }

        .hero-ampersand {
            font-style: italic;
            color: var(--sage-green);
            margin: 0 0.5rem;
            font-weight: 300;
        }

        .hero-tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: var(--text-light);
            font-weight: 400;
            line-height: 1.5;
        }

        .hero-emoji {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .hero-divider {
            display: none;
        }

        /* Events Section */
        .events {
            padding: 1rem 2rem 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .section-divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--sage-green), transparent);
            margin: 0 auto 2rem auto;
            opacity: 0;
        }

        .section-divider.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            text-align: center;
            margin-bottom: 1rem;
            color: var(--text-dark);
            opacity: 0;
            font-weight: 400;
        }

        .section-title.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-size: 1.1rem;
            opacity: 0;
        }

        .section-subtitle.visible {
            animation: fadeInUp 0.4s ease-out 0.1s forwards;
        }

        .events-grid {
            display: grid;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .event-card {
            background: white;
            border: 1px solid rgba(139, 157, 131, 0.2);
            border-radius: 8px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .event-card.visible {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(139, 157, 131, 0.2);
        }

        .event-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, var(--event-color), transparent);
        }

        .event-card.haldi { --event-color: var(--sage-green); }
        .event-card.western { --event-color: var(--terracotta); }
        .event-card.indian { --event-color: var(--gold); }

        .event-card.haldi:nth-child(1) { animation-delay: 0.05s; }
        .event-card.western:nth-child(2) { animation-delay: 0.1s; }
        .event-card.indian:nth-child(3) { animation-delay: 0.15s; }

        .event-number {
            display: none;
        }

        .event-emoji {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: block;
        }

        .event-dress-code {
            margin-top: 1rem;
            padding: 0.875rem;
            background: var(--cream);
            border-radius: 6px;
            font-size: 0.875rem;
            color: var(--text-dark);
        }

        .event-dress-code strong {
            color: var(--event-color);
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .event-date {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--event-color);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 500;
        }

        .event-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .event-time {
            color: var(--text-light);
            margin-bottom: 0.75rem;
            font-size: 0.95rem;
        }

        .event-location {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .event-location-icon {
            color: var(--event-color);
            margin-top: 0.2rem;
            flex-shrink: 0;
        }

        .event-location-text {
            color: var(--text-dark);
        }

        .event-link {
            display: inline-block;
            margin-top: 0.5rem;
            color: var(--event-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
        }

        .event-link:hover {
            opacity: 0.7;
        }

        .event-note {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--cream);
            border-left: 3px solid var(--sage-green);
            font-size: 0.9rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* RSVP Section */
        .rsvp {
            padding: 6rem 2rem;
            background: linear-gradient(to bottom, var(--cream), var(--ivory));
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .rsvp::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--sage-green), transparent);
        }

        .rsvp-content {
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
        }

        .rsvp-content.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .rsvp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            margin-bottom: 1.5rem;
            color: var(--text-dark);
            font-weight: 400;
        }

        .rsvp-message {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .rsvp-deadline {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            border: 1px solid var(--sage-green);
            border-radius: 4px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(139, 157, 131, 0.1);
        }

        .rsvp-deadline-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .rsvp-deadline-date {
            font-weight: 600;
            color: var(--sage-green);
        }

        .whatsapp-button {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.2rem 2.5rem;
            background: var(--sage-green);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 157, 131, 0.3);
        }

        .whatsapp-button:hover {
            background: var(--terracotta);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 117, 87, 0.4);
        }

        .whatsapp-icon {
            width: 24px;
            height: 24px;
        }

        /* Photo Gallery */
        .gallery {
            padding: 6rem 2rem 8rem;
            background: var(--cream);
        }

        .gallery-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            text-align: center;
            margin-bottom: 4rem;
            color: var(--text-dark);
            opacity: 0;
            font-weight: 400;
        }

        .gallery-title.visible {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4/5;
            background: white;
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .gallery-item.wide {
            grid-column: 1 / -1;
            aspect-ratio: 21/9;
            max-width: 1000px;
            justify-self: center;
        }

        .gallery-item.visible {
            animation: photoReveal 0.4s ease-out forwards;
        }

        @keyframes photoReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .gallery-item:nth-child(1) { animation-delay: 0.05s; }
        .gallery-item:nth-child(2) { animation-delay: 0.1s; }
        .gallery-item:nth-child(3) { animation-delay: 0.15s; }
        .gallery-item:nth-child(4) { animation-delay: 0.2s; }
        .gallery-item:nth-child(5) { animation-delay: 0.25s; }
        .gallery-item:nth-child(6) { animation-delay: 0.3s; }
        .gallery-item:nth-child(7) { animation-delay: 0.35s; }
        .gallery-item:nth-child(8) { animation-delay: 0.4s; }
        .gallery-item:nth-child(9) { animation-delay: 0.45s; }
        .gallery-item:nth-child(10) { animation-delay: 0.5s; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            text-align: center;
            padding: 2rem;
        }

        /* Footer */
        .footer {
            padding: 3rem 2rem;
            background: var(--charcoal);
            color: var(--cream);
            text-align: center;
        }

        .footer-hearts {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0.6;
            color: var(--sage-green);
            line-height: 1;
        }

        .footer-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .palm-tree {
                top: 15px;
                right: 20px;
                font-size: 2rem;
            }

            .rsvp-link {
                top: 18px;
                right: 70px;
                font-size: 0.75rem;
            }

            .hero {
                min-height: 70vh;
                padding: 1.5rem 1.5rem 0 1.5rem;
            }

            .hero-photo-container {
                width: 320px;
                height: 220px;
            }

            .hero-content {
                text-align: center;
            }

            .hero-names {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .events {
                padding: 1rem 1.5rem 4rem 1.5rem;
            }

            .event-card {
                padding: 2rem 1.5rem;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 1.5rem;
            }

            .rsvp {
                padding: 4rem 1.5rem;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

            <div class="gallery-item visible"><img src="/photos/19.jpg" style="opacity: 1; transition: opacity 0.5s;"></div>
            <div class="gallery-item visible"><img src="/photos/20.jpg" style="opacity: 1; transition: opacity 0.5s;"></div>
            <div class="gallery-item visible"><img src="/photos/22.jpg" style="opacity: 1; transition: opacity 0.5s;"></div>
            <div class="gallery-item wide visible"><img src="/photos/17.jpg" style="opacity: 1; transition: opacity 0.5s;"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-hearts">♡</div>
        <p class="footer-text">Amogh &amp; Helene · April 2026</p>
    </footer>

    <script>
        // Parse URL path to extract invitation type and guest name
        const pathname = window.location.pathname;
        const pathParts = pathname.split('/').filter(part => part.length > 0);

        // First part is invitation type, second part (if exists) is guest name
        const inviteType = pathParts[0] || '';
        const guestName = pathParts[1] ? decodeURIComponent(pathParts[1]) : '';

        // Event data
        const events = {
            haldi: {
                number: '01',
                emoji: '🌼',
                date: 'Friday, April 18, 2026',
                title: 'Haldi & Mehndi',
                time: '11:00 AM - 5:00 PM',
                location: 'Quakers Hill Community Centre',
                link: 'https://maps.app.goo.gl/GEoJuv2DP5TkgT8cE',
                dressCode: 'Bright colors! Think yellows, oranges, pinks. Traditional Indian attire encouraged.',
                class: 'haldi'
            },
            western: {
                number: '02',
                emoji: '🤵',
                date: 'Saturday, April 19, 2026',
                title: 'Western Wedding Ceremony',
                time: '9:00 AM - 4:00 PM',
                location: 'Sergeants Mess',
                link: 'https://maps.app.goo.gl/TwcoODfiT6MK6sx1m',
                note: 'We will have an after party at our place 🕺',
                dressCode: 'Semi-formal to formal. Suits, dresses, or cocktail attire.',
                class: 'western'
            },
            indian: {
                number: '03',
                emoji: '🇮🇳',
                date: 'Sunday, April 20, 2026',
                title: 'Indian Wedding Ceremony',
                time: '4:00 PM - 11:00 PM',
                location: 'The Madison Function Centre',
                link: 'https://maps.app.goo.gl/CAdsmAWPHs50B1Vrd',
                dressCode: 'Indian formal attire. Sarees, lehengas, kurtas, or sherwanis encouraged.',
                class: 'indian'
            }
        };

        // Determine which events to show
        let eventsToShow = [];
        if (inviteType === 'vip') {
            eventsToShow = [events.haldi, events.western, events.indian];
        } else if (inviteType === 'friends') {
            eventsToShow = [events.western, events.indian];
        } else if (inviteType === 'wedding') {
            eventsToShow = [events.indian];
        }

        // If no invitation type, show message instead of events
        if (!inviteType) {
            document.getElementById('eventsTitle').textContent = 'Please access the specific link we shared for event details';
            document.getElementById('eventsGrid').style.display = 'none';
        } else {
            // Personalize greeting
            if (guestName) {
                document.getElementById('greeting').textContent = `👋 ${guestName},`;
            }

            // Update title based on number of events
            if (eventsToShow.length === 1) {
                document.getElementById('eventsTitle').textContent = 'Join our celebration';
            } else {
                document.getElementById('eventsTitle').textContent = 'Join our celebrations';
            }

            // Render events
            const eventsGrid = document.getElementById('eventsGrid');
            eventsToShow.forEach(event => {
                const card = document.createElement('div');
                card.className = `event-card ${event.class}`;
                card.innerHTML = `
                    <div class="event-number">${event.number}</div>
                    <span class="event-emoji">${event.emoji}</span>
                    <div class="event-date">${event.date}</div>
                    <h3 class="event-title">${event.title}</h3>
                    <div class="event-time">${event.time}</div>
                    <div class="event-location">
                        <span class="event-location-icon">📍</span>
                        <div>
                            <div class="event-location-text">${event.location}</div>
                            <a href="${event.link}" target="_blank" class="event-link">View on Google Maps →</a>
                        </div>
                    </div>
                    ${event.note ? `<div class="event-note">${event.note}</div>` : ''}
                    <div class="event-dress-code">
                        <strong>Dress Code</strong>
                        ${event.dressCode}
                    </div>
                `;
                eventsGrid.appendChild(card);
            });
        }

        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe elements
        document.querySelectorAll('.section-title, .section-subtitle, .event-card, .rsvp-content, .gallery-title, .gallery-item').forEach(el => {
            observer.observe(el);
        });

        // Hero photo and gallery photos are already loaded in HTML
    </script>


</body></html>
